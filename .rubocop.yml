plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 2.5.0

Style/FrozenStringLiteralComment:
  Enabled: false

Metrics/BlockLength:
  AllowedMethods: ['describe', 'context', 'shared_examples']

RSpec/MultipleExpectations:
  Max: 2

RSpec/NestedGroups:
  Max: 4
